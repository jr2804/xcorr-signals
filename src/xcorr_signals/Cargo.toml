[package]
name = "xcorr_signals_core"
# CalVer YYYY.M.N is the single source of truth; the release workflow
# rewrites this line before running maturin build so the built wheel
# matches the sdist version produced by uv-dynamic-versioning.
# Local dev builds get "0.0.0" (mismatch with sdist is expected).
version = "0.0.0"
edition = "2021"
license = "MIT"
authors = ["Jan.Reimes <jan.reimes@head-acoustics.com>"]
description = "Rust core for cross-correlation delay estimation of audio signals"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
ndarray = "0.17"
rustfft = "6.2"
realfft = "3.4"
pyo3 = { version = "0.29", optional = true }
numpy = { version = "0.29", optional = true }

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy", "pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "fat"
incremental = false
panic = "abort"
