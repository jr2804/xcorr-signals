[package]
name = "xcorr_signals_core"
# CalVer YYYY.M.N is the single source of truth; the release workflow
# rewrites this line before running maturin build so the built wheel
# matches the release tag. Local dev builds get "0.0.0".
version = "2026.11.4"
edition = "2021"
license = "MIT"
authors = ["Jan.Reimes <jan.reimes@head-acoustics.com>"]
description = "Rust core for cross-correlation delay estimation of audio signals"

[lib]
name = "xcorr_signals"
# cdylib for the Python extension; rlib so the crate can be used as a
# pure-Rust dependency with `default-features = false`.
crate-type = ["cdylib", "rlib"]

[dependencies]
ndarray = "0.17"
rustfft = "6.2"
realfft = "3.4"
# abi3-py313 keeps one wheel installable on CPython 3.13 and newer.
pyo3 = { version = "0.29", optional = true, features = ["abi3-py313"] }
numpy = { version = "0.29", optional = true }

[features]
default = ["python"]
# Python extension bindings; disable with --no-default-features for pure Rust.
python = ["dep:pyo3", "dep:numpy", "pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "fat"
incremental = false
panic = "abort"
