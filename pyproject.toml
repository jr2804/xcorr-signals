[project]
name = "xcorr-signals"
# `version` is declared dynamic and resolved from the maturin
# build environment (which reads Cargo.toml). Keeping a literal here
# would be ignored by maturin anyway — see rust-pyo3-bindings skill §3.
dynamic = ["version"]
description = "Fast cross-correlation for determining and compensating delay between audio signal channels, implemented in Rust"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Jan.Reimes", email = "jan.reimes@head-acoustics.com" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "typer>=0.12.0",
    "numpy>=2.0.0",
]

[project.scripts]
xcorr-signals = "xcorr_signals.cli.app:cli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "zensical>=0.0.26",
    "mkdocstrings[python]>=0.29",
    "markdown-exec>=1.8",
    "markdown-callouts>=0.4",
    "ghp-import>=2.1",
    "maturin>=1.5.0",
    "mkdocs-mermaid2-plugin>=1.2",
    "xy>=0.0.7",
    "matplotlib>=3.8",
]

[build-system]
requires = ["maturin>=1.5.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "src/xcorr_signals/Cargo.toml"
python-source = "src"
# Explicit: maturin does not derive the Python package dir from [lib]
# name when manifest-path points elsewhere; without this it looks for
# src/xcorr-signals (raw project name) and fails.
module-name = "xcorr_signals"
include = ["Cargo.toml", "src/**/*.rs"]
# target/ would otherwise be packaged when building from an extracted
# sdist (no .gitignore there) — wheel balloons to gigabytes and zip64
# fails with "Large file option has not been set".
exclude = ["**/target/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short"

[tool.pytest-cov]
addopts = "--cov=xcorr_signals --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 100

[tool.codespell]
skip = "*.svg,*site,*venv"
ignore-words-list = "nd,ba,boundary"

[tool.uv]
default-groups = "all"
