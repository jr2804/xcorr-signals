[project]
name = "xcorr-signals"
dynamic = ["version"]
description = "Fast cross-correlation for determining and compensating delay between audio signal channels, implemented in Rust"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Jan.Reimes", email = "jan.reimes@head-acoustics.com" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "typer>=0.12.0",
    "numpy>=2.0.0",
]

[project.scripts]
xcorr-signals = "xcorr_signals.cli.app:main"
xcorr_signals = "xcorr_signals.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "zensical>=0.0.26",
    "mkdocstrings[python]>=0.29",
    "markdown-exec>=1.8",
    "markdown-callouts>=0.4",
    "ghp-import>=2.1",
    "maturin>=1.5.0",
    "mkdocs-mermaid2-plugin>=1.2",
    "xy>=0.0.7",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning", "maturin>=0.20"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xcorr_signals"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
# CalVer YYYY.M.N: version comes exclusively from the release tag
# pushed by .github/workflows/release.yml. uv-dynamic-versioning
# matches the tag with the regex below; `latest-tag` selects the
# most recent matching tag rather than commit-count schemes.
vcs = "git"
style = "pep440"
latest-tag = true
tag-dir = "tags"
pattern = '^(?P<base>\d{4}\.\d{1,2}\.\d+)$'

[tool.maturin]
manifest-path = "src/xcorr_signals/Cargo.toml"
python-source = "src"
module-name = "xcorr_signals._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short"

[tool.pytest-cov]
addopts = "--cov=xcorr_signals --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 100

[tool.codespell]
skip = "*.svg,*site,*venv"
ignore-words-list = "nd,ba,boundary"

[tool.uv]
default-groups = "all"
